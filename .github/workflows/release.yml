name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: linux-x86_64
          - os: windows-latest
            arch: windows-x86_64

    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Install Zig (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:/tools | Out-Null
          curl.exe -fsSL -o C:/tools/zig.zip https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
          Expand-Archive -Path C:/tools/zig.zip -DestinationPath C:/tools
          Add-Content $env:GITHUB_PATH "C:\tools\zig-x86_64-windows-0.16.0"

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            zig-pkg
          key: ${{ runner.os }}-zig-${{ hashFiles('build.zig.zon') }}

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools patchelf libgl1-mesa-dev
          pip install aqtinstall
          aqt install-qt --outputdir "$HOME/qt" linux desktop 6.8.3 gcc_64

      - name: Overlay Qt 6.8 into system paths (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          QT=$HOME/qt/6.8.3/gcc_64

          sudo rm -rf /usr/include/x86_64-linux-gnu/qt6
          sudo ln -s $QT/include /usr/include/x86_64-linux-gnu/qt6

          sudo rm -rf /usr/lib/x86_64-linux-gnu/qt6
          sudo ln -s $QT/lib /usr/lib/x86_64-linux-gnu/qt6

          for f in $QT/lib/libQt6*.so*; do
            sudo rm -f /usr/lib/x86_64-linux-gnu/$(basename $f)
            sudo ln -s $f /usr/lib/x86_64-linux-gnu/$(basename $f)
          done

          echo "$QT/lib" | sudo tee /etc/ld.so.conf.d/qt6.conf
          sudo ldconfig

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install aqtinstall
          mkdir -p C:/Qt
          aqt install-qt --outputdir C:/Qt windows desktop 6.8.3 win64_llvm_mingw

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtBin = "C:/Qt/6.8.3/llvm-mingw_64/bin"
          & "$qtBin/windeployqt.exe" zig-out/bin/omc.exe --release --no-translations
          $pkg = "omc-$env:TAG-$env:ARCH"
          New-Item -ItemType Directory -Path $pkg | Out-Null
          Move-Item zig-out/bin/* $pkg/
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: bash .github/scripts/package-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omc-${{ github.ref_name }}-${{ matrix.arch }}
          path: omc-*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: omc-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
